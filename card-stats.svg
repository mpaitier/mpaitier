<svg xmlns="http://www.w3.org/2000/svg" width="420" height="215" viewBox="0 0 420 215"><style>
  .t { font: 800 20px 'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif; fill: #F5F5F5; letter-spacing: .5px; }
  .d { font: 400 13.5px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F5F5F5; }
  .m { font: 600 12.5px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #9A9A9A; }
  .k { font: 700 12px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FF0022; letter-spacing: .8px; }
  .v { font: 800 26px 'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif; fill: #F5F5F5; }
  .tag { font: 700 11px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0D0D0D; }
  .in { animation: in .6s ease-out both; }
  @keyframes in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
</style><defs>
