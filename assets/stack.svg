<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130">

<style>
  .jig { animation: jig 3.2s steps(1) infinite; }
  .j1 { animation-delay: -1.1s; }
  .j2 { animation-delay: -2.2s; }
  @keyframes jig {
    0%   { transform: rotate(0deg) translateY(0); }
    92%  { transform: rotate(0deg) translateY(0); }
    94%  { transform: rotate(-4deg) translateY(-3px); }
    96%  { transform: rotate(3deg) translateY(2px); }
    98%  { transform: rotate(0deg) translateY(0); }
  }
  .shard { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .82; } }
  .slide { animation: slide 6s linear infinite; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-40px); } }
</style>

